<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golden Road Reroll Optimizer</title>
<style>
:root{--green:#22c55e;--red:#ef4444;--neutral:#94a3b8;--muted:#64748b;--gold:#f1c40f;--bg:#0a0e1a;--card:#0f172a;--card-inner:#071120;--border:#334155;--text:#e2e8f0;--heading:#cbd5e1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
h1{color:var(--gold);margin-bottom:4px;font-size:1.5rem;text-align:center}
.subtitle{color:var(--neutral);margin-bottom:20px;font-size:.85rem;text-align:center}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;justify-content:center}
select{background:var(--card-inner);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:.9rem;min-width:140px}
select:focus{outline:none;border-color:var(--gold)}
.card{background:var(--card-inner);border-radius:10px;padding:20px;margin-bottom:16px}
.card h2{font-size:1.1rem;margin-bottom:12px;color:var(--heading)}
.roster{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;justify-content:center}
.role-card{background:var(--card-inner);border-radius:8px;padding:12px;text-align:center;min-width:100px;flex:1}
.role-card .role{font-size:.7rem;text-transform:uppercase;color:var(--muted);letter-spacing:1px}
.role-card .name{font-size:.9rem;font-weight:600;margin:4px 0}
.role-card .rating{font-size:1.4rem;font-weight:700;color:var(--gold)}
.role-card .rank{font-size:.7rem;color:var(--neutral);margin-top:2px}
.team-avg{text-align:center;font-size:1rem;color:var(--neutral);margin-top:8px}
.team-avg span{color:var(--gold);font-weight:700;font-size:1.2rem}
.rerolls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.reroll-card{background:var(--card);border-radius:8px;padding:16px;text-align:center}
.reroll-card h3{font-size:1.1rem;color:var(--heading);margin-bottom:10px}
.reroll-card .pct{font-size:1.8rem;font-weight:700}
.reroll-card .ev{font-size:1rem;margin-top:6px;font-weight:600}
.reroll-card .count{font-size:.75rem;color:var(--muted);margin-top:4px}
.green{color:var(--green)}.red{color:var(--red)}.neutral{color:var(--neutral)}
.targets{margin-top:12px;text-align:left;font-size:.75rem;color:var(--neutral);max-height:100px;overflow-y:auto}
.targets div{padding:2px 0;border-bottom:1px solid var(--card-inner)}
.unavailable{opacity:.4}
.unavailable .pct{color:var(--muted)}
.role-table tr td{background:var(--card-inner)}
.role-table tr td:first-child{border-radius:8px 0 0 8px}
.role-table tr td:last-child{border-radius:0 8px 8px 0}
@media(max-width:700px){.rerolls{grid-template-columns:1fr}.role-card{min-width:80px}}
</style>
</head>
<body>
<h1>Golden Road LOL Reroll Optimizer</h1>
<p class="subtitle">Select your current roll to see reroll EV and improvement odds</p>
<div class="controls">
<select id="region"><option value="">Region...</option></select>
<select id="team"><option value="">Team...</option></select>
<select id="year"><option value="">Year...</option></select>
</div>
<div id="output"></div>

<script src="data.js"></script>
<script>
// Flatten GAME_TEAMS (game's format) into NODES (one entry per team-year)
const NODES = [];
GAME_TEAMS.forEach(t => {
  Object.entries(t.rosters).forEach(([yr, roster]) => {
    const players = {};
    ['TOP','JNG','MID','ADC','SUP'].forEach(role => {
      players[role] = (roster[role]||[]).map(([name, rating]) => ({name, rating}));
    });
    NODES.push({ teamId: t.id, team: t.name, region: t.region, year: +yr, players });
  });
});

// Compute derived fields
const byRegionYear = {};
const byTeamRegion = {};
NODES.forEach((n, i) => {
  const best = ['TOP','JNG','MID','ADC','SUP'].map(r => n.players[r].length ? Math.max(...n.players[r].map(p=>p.rating)) : 0).filter(v=>v>0);
  n.avg = Math.round(best.reduce((s,v)=>s+v,0) / best.length * 10) / 10;
  n.idx = i;
  const ryKey = n.region + '|' + n.year;
  (byRegionYear[ryKey] = byRegionYear[ryKey] || []).push(i);
  const trKey = n.teamId + '|' + n.region;
  (byTeamRegion[trKey] = byTeamRegion[trKey] || []).push(i);
});
NODES.forEach((n, i) => {
  n.yearTargets = (byTeamRegion[n.teamId + '|' + n.region] || []).filter(j => j !== i);
  n.teamTargets = (byRegionYear[n.region + '|' + n.year] || []).filter(j => j !== i);
  n.regionTargets = [];
  Object.keys(byRegionYear).forEach(key => {
    const [reg, yr] = key.split('|');
    if (reg !== n.region && +yr === n.year) n.regionTargets.push(...byRegionYear[key]);
  });
});

// Build global role rankings (sorted desc by rating)
const ROLE_RANKINGS = {};
['TOP','JNG','MID','ADC','SUP'].forEach(role => {
  const all = NODES.flatMap(n => (n.players[role]||[]).map(p=>p.rating)).sort((a,b)=>b-a);
  ROLE_RANKINGS[role] = all;
});
function getRoleRank(role, rating) {
  const arr = ROLE_RANKINGS[role];
  const rank = arr.filter(r => r > rating).length + 1;
  return rank + '/' + arr.length;
}

const regionEl = document.getElementById('region');
const teamEl = document.getElementById('team');
const yearEl = document.getElementById('year');
const outputEl = document.getElementById('output');

// Populate regions
const regions = [...new Set(NODES.map(n=>n.region))].sort();
regions.forEach(r => { const o=document.createElement('option'); o.value=r; o.textContent=r; regionEl.appendChild(o); });

let skipAutoFill = false;

regionEl.onchange = () => {
  teamEl.innerHTML = '<option value="">Team...</option>';
  yearEl.innerHTML = '<option value="">Year...</option>';
  outputEl.innerHTML = '';
  const teams = [...new Set(NODES.filter(n=>n.region===regionEl.value).map(n=>JSON.stringify({id:n.teamId,name:n.team})))].map(JSON.parse);
  teams.sort((a,b)=>a.name.localeCompare(b.name));
  teams.forEach(t => { const o=document.createElement('option'); o.value=t.id; o.textContent=t.name; teamEl.appendChild(o); });
  if (!skipAutoFill && teams.length === 1) { teamEl.value = teams[0].id; teamEl.onchange(); }
};

teamEl.onchange = () => {
  yearEl.innerHTML = '<option value="">Year...</option>';
  outputEl.innerHTML = '';
  const years = NODES.filter(n=>n.region===regionEl.value && n.teamId===teamEl.value).map(n=>n.year).sort((a,b)=>a-b);
  years.forEach(y => { const o=document.createElement('option'); o.value=y; o.textContent=y; yearEl.appendChild(o); });
  if (!skipAutoFill && years.length === 1) { yearEl.value = years[0]; yearEl.onchange(); }
};

yearEl.onchange = () => {
  render();
  if (regionEl.value && teamEl.value && yearEl.value) {
    history.replaceState(null, '', '?r=' + regionEl.value + '&t=' + teamEl.value + '&y=' + yearEl.value);
  }
};

(function loadFromParams() {
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  const p = new URLSearchParams(location.search);
  const region = p.get('r'), teamId = p.get('t'), year = p.get('y');
  if (!region || !teamId || !year) return;
  skipAutoFill = true;
  regionEl.value = region;
  if (!regionEl.value) { skipAutoFill = false; return; }
  regionEl.onchange();
  teamEl.value = teamId;
  if (!teamEl.value) { skipAutoFill = false; return; }
  teamEl.onchange();
  yearEl.value = year;
  skipAutoFill = false;
  if (!yearEl.value) return;
  setTimeout(render, 0);
})();

const C = {green:'#22c55e',red:'#ef4444',neutral:'#94a3b8',muted:'#64748b',gold:'#f1c40f'};
function col(val, greenAt, neutralAt) { return val >= greenAt ? 'green' : val >= neutralAt ? 'neutral' : 'red'; }
function colHex(val, greenAt, neutralAt) { return val >= greenAt ? C.green : val >= neutralAt ? C.neutral : C.red; }
function evCol(delta) { return delta > 0 ? 'green' : delta < 0 ? 'red' : 'neutral'; }

function render() {
  const node = NODES.find(n => n.region===regionEl.value && n.teamId===teamEl.value && n.year===+yearEl.value);
  if (!node) { outputEl.innerHTML=''; return; }

  const roles = ['TOP','JNG','MID','ADC','SUP'];
  
  // Compute reroll stats
  function rerollStats(targetIdxs) {
    if (!targetIdxs.length) return null;
    const targets = targetIdxs.map(i => NODES[i]);
    const evAvg = targets.reduce((s,t) => s+t.avg, 0) / targets.length;
    const improveP = targets.filter(t => t.avg > node.avg).length / targets.length;
    const delta = evAvg - node.avg;
    const roleStats = {};
    roles.forEach(role => {
      const curArr = node.players[role] || [];
      const cur = curArr.length ? Math.max(...curArr.map(p=>p.rating)) : 0;
      const tRatings = targets.map(t => { const a = t.players[role]||[]; return a.length ? Math.max(...a.map(p=>p.rating)) : 0; }).filter(r=>r>0);
      if (!tRatings.length) { roleStats[role] = null; return; }
      const ev = tRatings.reduce((s,r)=>s+r,0)/tRatings.length;
      const betterRatings = tRatings.filter(r=>r>cur);
      const upsideEv = betterRatings.length ? Math.round((betterRatings.reduce((s,r)=>s+r,0)/betterRatings.length - cur)*10)/10 : 0;
      roleStats[role] = { ev: Math.round(ev*10)/10, delta: Math.round((ev-cur)*10)/10, improveP: Math.round(tRatings.filter(r=>r>cur).length/tRatings.length*100), p90: Math.round(tRatings.filter(r=>r>=90).length/tRatings.length*100), upsideEv };
    });
    const betterTargets = targets.filter(t => t.avg > node.avg);
    const upsideEv = betterTargets.length ? Math.round((betterTargets.reduce((s,t)=>s+t.avg,0)/betterTargets.length - node.avg)*10)/10 : 0;
    return { count: targets.length, ev: Math.round(evAvg*10)/10, delta: Math.round(delta*10)/10, improveP: Math.round(improveP*100), upsideEv, roleStats, targets };
  }

  const yearR = rerollStats(node.yearTargets);
  const teamR = rerollStats(node.teamTargets);
  const regionR = rerollStats(node.regionTargets);

  let html = '<div class="card" style="background:var(--card)"><h2>' + node.team + ' ' + node.year + ' — ' + node.region + '</h2>';
  html += '<div class="roster">';
  roles.forEach(role => {
    const ps = node.players[role] || [];
    ps.forEach(p => {
      html += '<div class="role-card"><div class="role">' + role + '</div><div class="name">' + p.name + '</div><div class="rating">' + p.rating + '</div><div class="rank">#' + getRoleRank(role, p.rating) + '</div></div>';
    });
  });
  html += '</div><div class="team-avg">Team Average: <span>' + node.avg + '</span></div></div>';

  html += '<div class="rerolls">';
  [{label:'Region Reroll',data:regionR,desc:'Different region, same year'},{label:'Team Reroll',data:teamR,desc:'Same region+year, different team'},{label:'Year Reroll',data:yearR,desc:'Same team, different year'}].forEach(({label,data,desc}) => {
    if (!data) {
      html += '<div class="reroll-card unavailable"><h3>'+label+'</h3><div class="pct">N/A</div><div class="count">No targets available</div></div>';
      return;
    }
    const evColor = evCol(data.delta);
    html += '<div class="reroll-card"><h3>'+label+'</h3>';
    html += '<div class="pct '+col(data.improveP,50,15)+'">' + data.improveP + '%</div>';
    html += '<div class="count" style="margin-top:2px">chance team avg improves</div>';
    html += '<div class="ev"><span class="'+evColor+'">' + (data.delta>=0?'+':'') + data.delta + '</span> <span style="color:'+C.muted+'">EV</span></div>';
    html += '<div class="ev" style="font-size:.85rem"><span class="green">+' + data.upsideEv + '</span> <span style="color:'+C.muted+'">EV if better</span></div>';
    html += '<div class="count">' + data.count + ' targets · avg ' + data.ev + '</div>';
    html += '<div class="targets">';
    data.targets.sort((a,b)=>b.avg-a.avg).slice(0,8).forEach(t => {
      html += '<div>'+t.team+' '+t.year+' ('+t.avg+')</div>';
    });
    if(data.targets.length>8) html += '<div>...+'+(data.targets.length-8)+' more</div>';
    html += '</div></div>';
  });
  html += '</div>';

  // Per-role reroll breakdown
  html += '<div class="card" style="margin-top:12px;background:var(--card)"><h2>Per-Role Reroll Breakdown</h2>';
  html += '<table class="role-table" style="width:100%;border-collapse:separate;border-spacing:0 8px;font-size:1.15rem">';
  html += '<tr><th style="text-align:left;padding:8px;color:'+C.muted+'">Role</th><th style="padding:8px;color:'+C.muted+'">Current</th><th style="padding:8px;color:'+C.muted+'">Region</th><th style="padding:8px;color:'+C.muted+'">Team</th><th style="padding:8px;color:'+C.muted+'">Year</th></tr>';
  roles.forEach(role => {
    const cur = (node.players[role]||[]).length ? Math.max(...node.players[role].map(p=>p.rating)) : '—';
    const fmtCell = (stats) => {
      if(!stats) return '<td style="padding:8px;text-align:center;color:'+C.muted+'">—</td>';
      const evc = evCol(stats.delta);
      const p90c = col(stats.p90, 30, 15);
      const impc = colHex(stats.improveP, 50, 15);
      return '<td style="padding:8px"><table style="margin:0 auto;border-collapse:collapse;font-size:1rem"><tr><td style="text-align:right;padding-right:6px" class="'+evc+'">'+(stats.delta>=0?'+':'')+stats.delta+'</td><td style="color:'+C.muted+'">EV</td></tr><tr><td style="text-align:right;padding-right:6px;color:'+impc+'">'+stats.improveP+'%</td><td style="color:'+C.muted+'">improve</td></tr><tr><td style="text-align:right;padding-right:6px;color:'+C.green+'">+'+stats.upsideEv+'</td><td style="color:'+C.muted+'">if better</td></tr><tr><td style="text-align:right;padding-right:6px" class="'+p90c+'">'+stats.p90+'%</td><td style="color:'+C.muted+'">P(90+)</td></tr></table></td>';
    };
    html += '<tr><td style="padding:8px;font-weight:700">'+role+'</td><td style="padding:8px;text-align:center;color:'+C.gold+';font-weight:700">'+cur+'</td>';
    html += fmtCell(regionR?regionR.roleStats[role]:null);
    html += fmtCell(teamR?teamR.roleStats[role]:null);
    html += fmtCell(yearR?yearR.roleStats[role]:null);
    html += '</tr>';
  });
  html += '</table></div>';

  outputEl.innerHTML = html;
}
</script>
</body>
</html>
